<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Active Listening - Guess the Task</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/guess.css">
</head>
<body>

  <div class="guess-container animate-fade-in">
    <div class="guess-card">
      <div class="text-center mb-4" id="cardHeader">
        <div class="icon-header mb-3">
          <i class="bi bi-lightbulb-fill"></i>
        </div>
        <h2>Active Listening Guess</h2>
        <p class="text-muted">Scan the QR code, listen to the briefing, and submit your guess notes below.</p>
      </div>

      <!-- FORM -->
      <form id="guessForm">
        <!-- Student Name -->
        <div class="mb-3">
          <label for="studentName" class="form-label fw-semibold">Your Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="studentName" placeholder="Enter your name" required>
          </div>
        </div>

        <!-- Guess Work -->
        <div class="mb-4">
          <label for="contextGuess" class="form-label fw-semibold">Your Guess Work</label>
          <textarea class="form-control" id="contextGuess" rows="5" placeholder="Type your active listening guess work here. What is the topic? What details did you hear?" required></textarea>
          <div class="form-text">Write at least 20 characters of guess notes.</div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-gradient w-100 py-2.5 fw-semibold">
          <i class="bi bi-send-fill me-2"></i>Submit Guess
        </button>
      </form>

      <!-- SUCCESS OVERLAY -->
      <div id="successOverlay" class="success-overlay text-center hidden">
        <div class="success-checkmark mb-4">
          <div class="check-icon">
            <span class="icon-line line-tip"></span>
            <span class="icon-line line-long"></span>
            <div class="icon-circle"></div>
          </div>
        </div>
        <h4>Guess Submitted!</h4>
        <p class="text-muted mb-4">Great job! Your guess has been saved. Go back to the main screen to see the unlocked task details.</p>
        <button class="btn btn-outline-primary btn-sm" onclick="resetForm()">Submit Another Guess</button>
      </div>
    </div>
  </div>

  <!-- Firebase UMD SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Form Controller -->
  <script src="assets/js/guess.js"></script>
</body>
</html>
